<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Successful</title>

<style>
    body {
        min-height: 100vh;
        /* Matches the background logic in your register.html */
        background-image: url("{{ url_for('static', filename='images/photo.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .message-box {
        /* Matches the form-box style in your register.html */
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        text-align: center;
        color: white;
        max-width: 450px;
        width: 100%;
    }

    h2 {
        margin-bottom: 20px;
        color: #ffffff;
    }

    p {
        margin-bottom: 30px;
        color: #cccccc;
    }

    /* Common button styling matching your overall theme */
    .btn {
        display: block;
        padding: 14px;
        margin-bottom: 15px;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        text-align: center;
    }

    .btn:hover {
        transform: translateY(-2px);
    }

    /* Option 1: Green from your users.html table header */
    .btn-view {
        background: #4CAF50;
        color: white;
    }

    /* Option 2: Subtle style for back to registration */
    .btn-back {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Option 3: Special Dino feature button */
    .btn-dino {
        background: #555555;
        color: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .btn-dino:hover {
        background: #777777;
        box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
    }
</style>
</head>
<body>

<div class="container">
    <div class="message-box">
        <h2>✔ Success!</h2>
        <p>Your information has been saved successfully.</p>
        
        <a href="/users" class="btn btn-view">View Registered Users</a>
        
        <a href="/" class="btn btn-back">Back to Registration</a>

        <a href="chrome://dino" target="_blank" class="btn btn-dino">🦖 Play Chrome Dino Game</a>
    </div>
</div>

</body>
</html>
