<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
    body {
        min-height: 100vh;
        background-image: url("{{ url_for('static', filename='images/photo.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 100%;
        max-width: 450px;
        padding: 20px;
    }

    .form-box {
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        color: #f0f0f0;
    }

    h2 { text-align: center; color: #ffffff; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #cccccc; margin-bottom: 30px; font-size: 14px; }

    /* Flash Messages */
    .flash-message {
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        margin-bottom: 20px;
    }
    .flash-message.error { background: rgba(255, 99, 71, 0.2); border: 1px solid #ff6347; color: #ffcccb; }

    .form-group { margin-bottom: 15px; }
    label { display: block; color: #ddd; margin-bottom: 5px; font-size: 14px; }
    
    input[type="text"], input[type="password"], input[type="date"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        outline: none;
    }

    .gender-group { display: flex; justify-content: space-around; padding: 10px 0; }
    .btn-submit {
        width: 100%;
        padding: 14px;
        background: #4a4a4a;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
    }
    .btn-submit:hover { background: #666; transform: translateY(-2px); }
    a { color: #aaa; text-decoration: none; display: block; text-align: center; margin-top: 15px; font-size: 13px; }
</style>
</head>
<body>

<div class="container">
  <div class="form-box">
    <h2>User Registration</h2>
    <p class="subtitle">Please fill in your information</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/register" method="POST" onsubmit="return checkPassword()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>

      <label>Gender</label>
      <div class="gender-group">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div>

      <div class="form-group">
        <label>BirthDate</label>
        <input type="date" name="birthday" required>
      </div>

      <div class="form-group">
        <label>Cellphone Number</label>
        <input type="text" name="phone" placeholder="09171234567" required>
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm_password" required>
        <p id="message" style="font-size: 12px; margin-top: 5px;"></p>
      </div>

      <button type="submit" class="btn-submit">Register</button>
    </form>
  </div>
</div>

<script>
function checkPassword() {
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm_password").value;
  const message = document.getElementById("message");
  if (password !== confirm) {
    message.textContent = "Passwords do not match!";
    message.style.color = "#ff6347";
    return false;
  }
  return true;
}
</script>
</body>
</html>
